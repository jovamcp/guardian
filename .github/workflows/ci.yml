name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: "1.22"}
      - name: Go (fmt, vet, test, build)
        run: |
          test -z "$(gofmt -l cmd)"
          go vet ./...
          go test ./...
          go build -o bin/guardianctl ./cmd/guardianctl
      - name: Bash (sintaxis y shellcheck)
        run: |
          bash -n install.sh scripts/pin-images.sh sandbox/runner.sh
          sudo apt-get install -y -qq shellcheck >/dev/null
          shellcheck -S warning install.sh scripts/pin-images.sh sandbox/runner.sh
      - name: Compose (config con .env de prueba)
        run: |
          cp .env.example compose/.env
          sed -i 's/^WEBUI_SECRET_KEY=.*/WEBUI_SECRET_KEY=x/; s/^POCKET_ID_ENCRYPTION_KEY=.*/POCKET_ID_ENCRYPTION_KEY=dGVzdA==/; s/^LITELLM_MASTER_KEY=.*/LITELLM_MASTER_KEY=sk-x/; s/^LITELLM_SALT_KEY=.*/LITELLM_SALT_KEY=sk-y/; s/^LITELLM_DB_PASSWORD=.*/LITELLM_DB_PASSWORD=p/; s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=g/' compose/.env
          docker compose --env-file compose/.env -f compose/docker-compose.yml config --quiet
          test "$(docker compose --env-file compose/.env -f compose/docker-compose.yml config | grep -c 'published:')" = 2
          rm -f compose/.env
      - name: Imágenes fijadas por digest
        run: scripts/pin-images.sh --check
      - name: nftables (nft -c)
        run: |
          sudo apt-get install -y -qq nftables >/dev/null
          sudo nft -c -f nftables/guardian.nft
          sudo nft -c -f nftables/docker-user.nft
      - name: Caddyfile y Vector
        run: |
          docker run --rm -v "$PWD/compose/caddy:/etc/caddy:ro" -e DOMAIN=ai.home caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker build -q -t guardian/caddy-dns:ci compose/caddy
          docker build -q -f compose/gateway/Dockerfile -t guardian/gd-gateway:ci .
          docker run --rm -v "$PWD/compose/caddy:/etc/caddy:ro" -e DOMAIN=ejemplo.org -e ACME_EMAIL=a@ejemplo.org -e ACME_DNS_PROVIDER=cloudflare -e ACME_DNS_TOKEN=0123456789abcdef0123456789abcdef01234567 guardian/caddy-dns:ci caddy validate --config /etc/caddy/Caddyfile.acme-dns --adapter caddyfile
          printf -- '-f compose/tls-acme-dns.yml\n' > compose/.extra-files
          cp .env.example compose/.env && sed -i 's/^WEBUI_SECRET_KEY=.*/WEBUI_SECRET_KEY=x/; s/^POCKET_ID_ENCRYPTION_KEY=.*/POCKET_ID_ENCRYPTION_KEY=dGVzdA==/; s/^LITELLM_MASTER_KEY=.*/LITELLM_MASTER_KEY=sk-x/; s/^LITELLM_SALT_KEY=.*/LITELLM_SALT_KEY=sk-y/; s/^LITELLM_DB_PASSWORD=.*/LITELLM_DB_PASSWORD=p/; s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=g/' compose/.env
          docker compose --env-file compose/.env -f compose/docker-compose.yml -f compose/tls-acme-dns.yml config --quiet
          rm -f compose/.env compose/.extra-files
          docker run --rm -v "$PWD/compose/vector/vector.yaml:/etc/vector/vector.yaml:ro" timberio/vector:0.58.0-debian validate --no-environment /etc/vector/vector.yaml
      - name: Seguridad (gosec, staticcheck, gitleaks)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          # Exclusiones justificadas en docs/seguridad.md (taint genérico de una CLI que lee su propio
          # repo y lanza docker/systemctl; permisos 0644 de archivos públicos; errores ignorados en limpiezas).
          "$(go env GOPATH)/bin/gosec" -quiet -exclude=G101,G104,G115,G204,G301,G302,G304,G306,G702,G703,G704,G706,G708 ./...
          "$(go env GOPATH)/bin/staticcheck" ./...
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact
      - name: policy render con guardian.yaml de ejemplo
        run: |
          cp guardian.yaml.example guardian.yaml
          ./bin/guardianctl policy render fortios > /dev/null
          ./bin/guardianctl policy render opnsense | grep -vq '{{'
          ./bin/guardianctl policy render unifi | grep -vq '{{'
          ./bin/guardianctl policy render egress > /dev/null
          git diff --exit-code -- compose/squid/agents.conf compose/blocky/config.yml
