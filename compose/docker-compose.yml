# Guardian v0.1 — Fase 1: Caddy + Pocket ID + Open WebUI + Ollama + wg-easy.
#
# Reglas duras que este archivo respeta:
#   1. Ollama NO publica puertos; solo existe en la red gd_ai.
#   2. Solo se publican 443/tcp (caddy) y 51820/udp (wg-easy).
#   6. Ningún secreto aquí: todo viene de compose/.env (ignorado por git).
#
# Fuentes verificadas (2026-09-12) para nombres de variables y puertos:
#   - Pocket ID: https://pocket-id.org/docs/configuration/environment-variables
#                https://github.com/pocket-id/pocket-id/blob/main/docker-compose.yml
#                (imagen :v2, puerto 1411, volumen /app/data, ENCRYPTION_KEY obligatoria,
#                healthcheck `/app/pocket-id healthcheck`, TRUST_PROXY admite lista IP/CIDR desde v2.11)
#   - Open WebUI: https://docs.openwebui.com/reference/env-configuration/
#                 https://docs.openwebui.com/features/authentication-access/auth/sso/
#                 backend/open_webui/config.py y env.py en github.com/open-webui/open-webui
#                 (puerto 8080, /health, redirect URI <WEBUI_URL>/oauth/oidc/callback,
#                 AIOHTTP_CLIENT_SSL_CERT_FILE = bundle CA para el discovery OIDC vía aiohttp)
#   - wg-easy:  https://github.com/wg-easy/wg-easy/blob/master/docker-compose.yml
#               https://wg-easy.github.io/wg-easy/latest/advanced/config/optional-config/
#               https://wg-easy.github.io/wg-easy/latest/advanced/config/unattended-setup/
#               (imagen :15, UI en 51821/tcp, WireGuard 51820/udp, sin WG_HOST: asistente web
#               en el primer arranque o variables INIT_*; requiere /lib/modules:ro)
#   - Caddy: https://caddyserver.com/docs/caddyfile/directives/tls (tls internal)
#   - LiteLLM (Fase 2): https://docs.litellm.ai/docs/proxy/deploy (imagen fijada por versión,
#                puerto 4000, --config, DATABASE_URL/LITELLM_MASTER_KEY/LITELLM_SALT_KEY,
#                /health/liveliness y /health/readiness),
#                https://docs.litellm.ai/docs/proxy/virtual_keys (llaves virtuales exigen Postgres),
#                https://docs.litellm.ai/docs/providers/ollama (prefijo ollama_chat/)

name: guardian

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # Frontal: lo que Caddy expone. Subred fija para poder listarla en TRUST_PROXY.
  gd_front:
    name: gd_front
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # IA: Ollama solo vive aquí. Sin puertos publicados.
  gd_ai:
    name: gd_ai
    ipam:
      config:
        - subnet: 172.28.20.0/24
  # Agentes (Fase 2): red INTERNA, sin ruta por defecto ni NAT. Un agente solo ve lo que
  # está conectado aquí: el gateway LiteLLM, el DNS (Blocky) y el proxy (Squid).
  gd_agents:
    name: gd_agents
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  # Egreso (Fase 2): la única salida a Internet de los agentes, a través de Squid y Blocky.
  gd_egress:
    name: gd_egress
    ipam:
      config:
        - subnet: 172.28.40.0/24

volumes:
  caddy_data:
  caddy_config:
  pocket_id_data:
  open_webui_data:
  ollama_data:
  wg_easy_data:
  litellm_db_data:

services:
  caddy:
    image: caddy:2
    container_name: gd-caddy
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
      TZ: ${TZ}
    ports:
      # Solo IPv4 a propósito: con "443:443" Docker también escucha en [::]:443 mediante
      # docker-proxy (proceso del host), y ese tráfico entra por INPUT y no por FORWARD,
      # así que las reglas de origen de DOCKER-USER no lo verían. IPv6 queda para v0.2.
      - "0.0.0.0:443:443/tcp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gd_front
    healthcheck:
      # El admin API escucha en 127.0.0.1:2019 (Caddyfile: admin localhost:2019). Se usa la IP
      # porque en la imagen `localhost` resuelve primero a ::1 y el check fallaba.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2
    container_name: gd-pocket-id
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_URL: https://id.${DOMAIN}
      # Confiar en X-Forwarded-For solo desde la red donde vive Caddy.
      TRUST_PROXY: 172.28.10.0/24
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY}
      ALLOW_INSECURE_CALLBACK_URLS: "false"
      TZ: ${TZ}
    volumes:
      - pocket_id_data:/app/data
    networks:
      - gd_front
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: gd-open-webui
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ollama
    environment:
      TZ: ${TZ}
      WEBUI_URL: https://${DOMAIN}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
      # Registro solo vía OIDC. ENABLE_LOGIN_FORM oculta el formulario de contraseña.
      # OJO: en Open WebUI ENABLE_SIGNUP y ENABLE_LOGIN_FORM son "PersistentConfig": el valor
      # del entorno solo se lee en el PRIMER arranque y luego vive en la base de datos.
      # Para forzar el .env en un arranque posterior: ENABLE_PERSISTENT_CONFIG=false.
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM:-false}
      ENABLE_PERSISTENT_CONFIG: ${ENABLE_PERSISTENT_CONFIG:-true}
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_PROVIDER_NAME: Pocket ID
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: https://id.${DOMAIN}/.well-known/openid-configuration
      OAUTH_SCOPES: openid email profile
      # Guardian protege IA local: sin conexión a api.openai.com por defecto (evita llamadas
      # salientes en cada carga). Se puede activar en Admin → Ajustes → Conexiones.
      ENABLE_OPENAI_API: "false"
      # Confianza en la CA interna de Caddy SIN perder las CAs públicas: el `command` de abajo
      # concatena el bundle del sistema con compose/certs/root.crt en /tmp/ca-bundle.crt.
      #  - SSL_CERT_FILE / REQUESTS_CA_BUNDLE: httpx/requests/authlib (intercambio de tokens).
      #  - AIOHTTP_CLIENT_SSL_CERT_FILE: aiohttp (descarga del documento OIDC discovery).
      SSL_CERT_FILE: /tmp/ca-bundle.crt
      REQUESTS_CA_BUNDLE: /tmp/ca-bundle.crt
      AIOHTTP_CLIENT_SSL_CERT_FILE: /tmp/ca-bundle.crt
    # La imagen arranca con `bash start.sh` en /app/backend (Dockerfile upstream).
    command: ["bash", "-c", "cat /etc/ssl/certs/ca-certificates.crt /certs/root.crt > /tmp/ca-bundle.crt && exec bash start.sh"]
    extra_hosts:
      # El contenedor debe llegar a id.<DOMAIN> a través de Caddy (443 del host).
      - "id.${DOMAIN}:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
      - ./certs/root.crt:/certs/root.crt:ro
    networks:
      - gd_front
      - gd_ai
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama
    container_name: gd-ollama
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gd_ai
    # SIN `ports:` a propósito (regla dura 1).
    healthcheck:
      # La imagen no trae curl; `ollama list` falla si el servidor no responde.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # --- GPU NVIDIA (requiere nvidia-container-toolkit en el host) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # --- GPU AMD / ROCm (usa la imagen ollama/ollama:rocm) ---
    # image: ollama/ollama:rocm
    # devices:
    #   - /dev/kfd
    #   - /dev/dri

  # ---------------------------------------------------------------- Fase 2: gateway LLM
  litellm-db:
    image: postgres:16-alpine
    container_name: gd-litellm-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
      TZ: ${TZ}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    networks:
      - gd_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litellm:
    # Versión fijada (regla dura 4; la doc de LiteLLM desaconseja tags móviles).
    image: ghcr.io/berriai/litellm:v1.100.1
    container_name: gd-litellm
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${TZ}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Cifra credenciales guardadas en la base de datos. Se fija una vez y no se cambia.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      # Los modelos vienen del archivo, no de la base de datos ni de la UI.
      STORE_MODEL_IN_DB: "False"
      LITELLM_LOG: INFO
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      gd_front: {}          # Caddy publica api.<DOMAIN>
      gd_ai: {}             # Ollama y Postgres
      gd_agents:            # los agentes llaman a http://litellm:4000 con su llave virtual
        ipv4_address: 172.28.30.10
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: gd-wg-easy
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
      # UI web solo detrás de Caddy (vpn.<DOMAIN>); nunca se publica 51821.
      PORT: "51821"
      HOST: "0.0.0.0"
      INSECURE: "false"
      DISABLE_IPV6: "true"
      # wg-easy v15 se configura en el asistente web del primer arranque
      # (nombre de host = WG_HOST del .env, puerto 51820). Alternativa sin asistente:
      # INIT_ENABLED=true + INIT_USERNAME/INIT_PASSWORD/INIT_HOST/INIT_PORT.
    ports:
      - "0.0.0.0:51820:51820/udp"   # solo IPv4, mismo motivo que en caddy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wg_easy_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks:
      - gd_front
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:51821/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
