# Guardian v0.1 — Fase 1: Caddy + Pocket ID + Open WebUI + Ollama + wg-easy.
#
# Reglas duras que este archivo respeta:
#   1. Ollama NO publica puertos; solo existe en la red gd_ai.
#   2. Solo se publican 443/tcp (caddy) y 51820/udp (wg-easy).
#   6. Ningún secreto aquí: todo viene de compose/.env (ignorado por git).
#
# Fuentes verificadas (2026-09-12) para nombres de variables y puertos:
#   - Pocket ID: https://pocket-id.org/docs/configuration/environment-variables
#                https://github.com/pocket-id/pocket-id/blob/main/docker-compose.yml
#                (imagen :v2, puerto 1411, volumen /app/data, ENCRYPTION_KEY obligatoria,
#                healthcheck `/app/pocket-id healthcheck`, TRUST_PROXY admite lista IP/CIDR desde v2.11)
#   - Open WebUI: https://docs.openwebui.com/reference/env-configuration/
#                 https://docs.openwebui.com/features/authentication-access/auth/sso/
#                 backend/open_webui/config.py y env.py en github.com/open-webui/open-webui
#                 (puerto 8080, /health, redirect URI <WEBUI_URL>/oauth/oidc/callback,
#                 AIOHTTP_CLIENT_SSL_CERT_FILE = bundle CA para el discovery OIDC vía aiohttp)
#   - wg-easy:  https://github.com/wg-easy/wg-easy/blob/master/docker-compose.yml
#               https://wg-easy.github.io/wg-easy/latest/advanced/config/optional-config/
#               https://wg-easy.github.io/wg-easy/latest/advanced/config/unattended-setup/
#               (imagen :15, UI en 51821/tcp, WireGuard 51820/udp, sin WG_HOST: asistente web
#               en el primer arranque o variables INIT_*; requiere /lib/modules:ro)
#   - Caddy: https://caddyserver.com/docs/caddyfile/directives/tls (tls internal)
#   - LiteLLM (Fase 2): https://docs.litellm.ai/docs/proxy/deploy (imagen fijada por versión,
#                puerto 4000, --config, DATABASE_URL/LITELLM_MASTER_KEY/LITELLM_SALT_KEY,
#                /health/liveliness y /health/readiness),
#                https://docs.litellm.ai/docs/proxy/virtual_keys (llaves virtuales exigen Postgres),
#                https://docs.litellm.ai/docs/providers/ollama (prefijo ollama_chat/)
#   - Blocky (Fase 2): https://0xerr0r.github.io/blocky/latest/configuration/ (denylists/allowlists
#                por grupo, clientGroupsBlock por IP, blockType, ports.dns/http; imagen
#                ghcr.io/0xerr0r/blocky:vX.Y.Z)
#   - Squid (Fase 2): https://hub.docker.com/r/ubuntu/squid (config en /etc/squid/squid.conf,
#                snippets en /etc/squid/conf.d/, puerto 3128)
#   - Vector (Fase 3): https://vector.dev/docs/reference/configuration/sources/docker_logs/
#                (docker_host por TCP), .../sources/journald/, .../sinks/loki/ (labels templadas)
#   - docker-socket-proxy (Fase 3): https://github.com/Tecnativa/docker-socket-proxy
#                (variables CONTAINERS/EVENTS/INFO/POST; puerto 2375)
#   - Loki (Fase 3): https://grafana.com/docs/loki/latest/operations/storage/retention/
#                (compactor.retention_enabled, limits_config.retention_period, tsdb v13)
#   - Grafana (Fase 3): https://grafana.com/docs/grafana/latest/setup-grafana/configure-security/
#                configure-authentication/generic-oauth/ (GF_AUTH_GENERIC_OAUTH_*, /login/generic_oauth)

name: guardian

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

networks:
  # Frontal: lo que Caddy expone. Subred fija para poder listarla en TRUST_PROXY.
  gd_front:
    name: gd_front
    ipam:
      config:
        - subnet: 172.28.10.0/24
  # IA: Ollama solo vive aquí. Sin puertos publicados.
  gd_ai:
    name: gd_ai
    ipam:
      config:
        - subnet: 172.28.20.0/24
  # Agentes (Fase 2): red INTERNA, sin ruta por defecto ni NAT. Un agente solo ve lo que
  # está conectado aquí: el gateway LiteLLM, el DNS (Blocky) y el proxy (Squid).
  gd_agents:
    name: gd_agents
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  # Egreso (Fase 2): la única salida a Internet de los agentes, a través de Squid y Blocky.
  gd_egress:
    name: gd_egress
    ipam:
      config:
        - subnet: 172.28.40.0/24
  # Auditoría (Fase 3): red interna donde viven el proxy del socket de Docker, Vector y Loki.
  gd_audit:
    name: gd_audit
    internal: true
    ipam:
      config:
        - subnet: 172.28.50.0/24

volumes:
  caddy_data:
  caddy_config:
  pocket_id_data:
  open_webui_data:
  ollama_data:
  wg_easy_data:
  litellm_db_data:
  loki_data:
  grafana_data:
  vector_data:

services:
  caddy:
    image: caddy:2@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    container_name: gd-caddy
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN}
      TZ: ${TZ}
    ports:
      # Solo IPv4 a propósito: con "443:443" Docker también escucha en [::]:443 mediante
      # docker-proxy (proceso del host), y ese tráfico entra por INPUT y no por FORWARD,
      # así que las reglas de origen de DOCKER-USER no lo verían. IPv6 queda para v0.2.
      - "0.0.0.0:443:443/tcp"
    volumes:
      # Se monta el directorio, no el archivo: un bind de archivo suelto sigue apuntando al
      # inodo antiguo cuando se reemplaza el Caddyfile (git pull, tar) y `caddy reload` no ve nada.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - gd_front
    healthcheck:
      # El admin API escucha en 127.0.0.1:2019 (Caddyfile: admin localhost:2019). Se usa la IP
      # porque en la imagen `localhost` resuelve primero a ::1 y el check fallaba.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:v2@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
    container_name: gd-pocket-id
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_URL: https://id.${DOMAIN}
      # Confiar en X-Forwarded-For solo desde la red donde vive Caddy.
      TRUST_PROXY: 172.28.10.0/24
      ENCRYPTION_KEY: ${POCKET_ID_ENCRYPTION_KEY}
      ALLOW_INSECURE_CALLBACK_URLS: "false"
      TZ: ${TZ}
    volumes:
      - pocket_id_data:/app/data
    networks:
      - gd_front
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main@sha256:1a6399d237dc392a2313e0ca826020b3fd5d22536357840eb63393d18dc8b924
    container_name: gd-open-webui
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - ollama
    environment:
      TZ: ${TZ}
      WEBUI_URL: https://${DOMAIN}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OLLAMA_BASE_URL: http://ollama:11434
      # Registro solo vía OIDC. ENABLE_LOGIN_FORM oculta el formulario de contraseña.
      # OJO: en Open WebUI ENABLE_SIGNUP y ENABLE_LOGIN_FORM son "PersistentConfig": el valor
      # del entorno solo se lee en el PRIMER arranque y luego vive en la base de datos.
      # Para forzar el .env en un arranque posterior: ENABLE_PERSISTENT_CONFIG=false.
      ENABLE_SIGNUP: "false"
      ENABLE_LOGIN_FORM: ${ENABLE_LOGIN_FORM:-false}
      ENABLE_PERSISTENT_CONFIG: ${ENABLE_PERSISTENT_CONFIG:-true}
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_PROVIDER_NAME: Pocket ID
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OPENID_PROVIDER_URL: https://id.${DOMAIN}/.well-known/openid-configuration
      OAUTH_SCOPES: openid email profile
      # Guardian protege IA local: sin conexión a api.openai.com por defecto (evita llamadas
      # salientes en cada carga). Se puede activar en Admin → Ajustes → Conexiones.
      ENABLE_OPENAI_API: "false"
      # Confianza en la CA interna de Caddy SIN perder las CAs públicas: el `command` de abajo
      # concatena el bundle del sistema con compose/certs/root.crt en /tmp/ca-bundle.crt.
      #  - SSL_CERT_FILE / REQUESTS_CA_BUNDLE: httpx/requests/authlib (intercambio de tokens).
      #  - AIOHTTP_CLIENT_SSL_CERT_FILE: aiohttp (descarga del documento OIDC discovery).
      SSL_CERT_FILE: /tmp/ca-bundle.crt
      REQUESTS_CA_BUNDLE: /tmp/ca-bundle.crt
      AIOHTTP_CLIENT_SSL_CERT_FILE: /tmp/ca-bundle.crt
    # La imagen arranca con `bash start.sh` en /app/backend (Dockerfile upstream).
    command: ["bash", "-c", "cat /etc/ssl/certs/ca-certificates.crt /certs/root.crt > /tmp/ca-bundle.crt && exec bash start.sh"]
    extra_hosts:
      # El contenedor debe llegar a id.<DOMAIN> a través de Caddy (443 del host).
      - "id.${DOMAIN}:host-gateway"
    volumes:
      - open_webui_data:/app/backend/data
      - ./certs/root.crt:/certs/root.crt:ro
    networks:
      - gd_front
      - gd_ai
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  ollama:
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba
    container_name: gd-ollama
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gd_ai
    # SIN `ports:` a propósito (regla dura 1).
    healthcheck:
      # La imagen no trae curl; `ollama list` falla si el servidor no responde.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # --- GPU NVIDIA (requiere nvidia-container-toolkit en el host) ---
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # --- GPU AMD / ROCm (usa la imagen ollama/ollama:rocm) ---
    # image: ollama/ollama:rocm
    # devices:
    #   - /dev/kfd
    #   - /dev/dri

  # ---------------------------------------------------------------- Fase 2: gateway LLM
  litellm-db:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: gd-litellm-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
      POSTGRES_DB: litellm
      TZ: ${TZ}
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    networks:
      - gd_ai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  litellm:
    # Versión fijada (regla dura 4; la doc de LiteLLM desaconseja tags móviles).
    image: ghcr.io/berriai/litellm:v1.100.1@sha256:a3715fa7ad8387941ab697259bd2881d68931657247a41984f90fae6d11c62bf
    container_name: gd-litellm
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      TZ: ${TZ}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # Cifra credenciales guardadas en la base de datos. Se fija una vez y no se cambia.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD}@litellm-db:5432/litellm
      # Los modelos vienen del archivo, no de la base de datos ni de la UI.
      STORE_MODEL_IN_DB: "False"
      LITELLM_LOG: INFO
      # Auditoría: un evento JSON por petición (alias de llave, modelo, tokens, coste) hacia Vector.
      GENERIC_LOGGER_ENDPOINT: http://vector:8687/litellm
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      gd_front: {}          # Caddy publica api.<DOMAIN>
      gd_ai: {}             # Ollama y Postgres
      gd_agents:            # los agentes llaman a http://litellm:4000 con su llave virtual
        ipv4_address: 172.28.30.10
      gd_audit: {}          # eventos de auditoría por petición hacia Vector (Fase 3)
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  # ---------------------------------------------------------------- Fase 2: egreso de agentes
  blocky:
    image: ghcr.io/0xerr0r/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    container_name: gd-blocky
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
    volumes:
      # Generado por `guardianctl policy render egress` a partir de agents/*.yaml.
      - ./blocky/config.yml:/app/config.yml:ro
    networks:
      gd_egress: {}
      gd_agents:
        ipv4_address: 172.28.30.53     # DNS de los agentes (--dns en el runner)
    healthcheck:
      test: ["CMD", "/app/blocky", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  squid:
    image: ubuntu/squid:6.6-24.04_beta@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    container_name: gd-squid
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      # Generado por `guardianctl policy render egress`: una ACL por agente.
      - ./squid/agents.conf:/etc/squid/conf.d/guardian-agents.conf:ro
    networks:
      gd_egress: {}
      gd_agents:
        ipv4_address: 172.28.30.3      # HTTPS_PROXY de los agentes
    healthcheck:
      # La imagen no trae curl ni squidclient: basta con que el puerto acepte conexiones.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3128"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- Fase 3: auditoría
  docker-socket-proxy:
    # Único contenedor que ve el socket de Docker: solo lectura (GET) de contenedores, logs y
    # eventos; POST/exec/build deshabilitados. Red interna sin salida.
    image: ghcr.io/tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: gd-docker-socket-proxy
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs:
      - /run
      - /tmp                # el entrypoint escribe haproxy.cfg en /tmp
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      VERSION: "1"
      PING: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      SERVICES: "0"
      TASKS: "0"
      NODES: "0"
      SWARM: "0"
      SYSTEM: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      SECRETS: "0"
      PLUGINS: "0"
      DISTRIBUTION: "0"
      AUTH: "0"
      SESSION: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - gd_audit
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  vector:
    image: timberio/vector:0.58.0-debian@sha256:1c1ea358c617ea0b23003d5af87f7a678b30f8f7096437e680380c47fc13d2d9
    container_name: gd-vector
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - docker-socket-proxy
      - loki
    environment:
      TZ: ${TZ}
      VECTOR_CONFIG: /etc/vector/vector.yaml
      DOCKER_HOST: http://docker-socket-proxy:2375
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      - vector_data:/var/lib/vector
      # Descartes de nftables (kernel) vía journald, solo lectura.
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    networks:
      - gd_audit
    healthcheck:
      # La imagen debian de Vector no trae wget/curl; basta con que el API acepte conexiones.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8686"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  loki:
    image: grafana/loki:3.7.7@sha256:d70e4659623f3e109af669cae76fe2a5dd5be54e2298fe8aed380d982fbc2500
    container_name: gd-loki
    restart: unless-stopped
    logging: *default-logging
    command: ["-config.file=/etc/loki/loki.yaml", "-config.expand-env=true"]
    environment:
      TZ: ${TZ}
      # Retención en horas = audit.retention_days × 24 (guardian.yaml). Por defecto 30 días.
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-720h}
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks:
      - gd_audit
    # Sin healthcheck de Docker: la imagen de Loki es distroless (sin shell ni wget).
    # `guardianctl doctor` comprueba /ready desde la red gd_audit.

  grafana:
    image: grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
    container_name: gd-grafana
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - loki
    environment:
      TZ: ${TZ}
      GF_SERVER_ROOT_URL: https://logs.${DOMAIN}
      GF_SERVER_DOMAIN: logs.${DOMAIN}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # OIDC con Pocket ID (cliente "grafana"; callback https://logs.<DOMAIN>/login/generic_oauth).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Pocket ID
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid email profile groups
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://id.${DOMAIN}/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://id.${DOMAIN}/api/oidc/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://id.${DOMAIN}/api/oidc/userinfo
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_CLIENT_CA: /certs/root.crt
      # Grupo "admins" de Pocket ID → Admin; el resto, Viewer.
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(groups[*], 'admins') && 'Admin' || 'Viewer'
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "false"
      # Sin formulario local: solo OIDC. El admin local queda para emergencias por
      # GF_AUTH_DISABLE_LOGIN_FORM=false en compose/.env si hiciera falta.
      GF_AUTH_DISABLE_LOGIN_FORM: ${GRAFANA_DISABLE_LOGIN_FORM:-true}
      # Alertas → ntfy (webhook con plantilla de Grafana). Vacío = sin alertas externas.
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-guardian}
    extra_hosts:
      - "id.${DOMAIN}:host-gateway"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./certs/root.crt:/certs/root.crt:ro
    networks:
      - gd_front
      - gd_audit
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15@sha256:0e7bc9d34e86ddcaa92bc700d4d7dc9b33291dbc07ac8d13382f7c2095f949ec
    container_name: gd-wg-easy
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: ${TZ}
      # UI web solo detrás de Caddy (vpn.<DOMAIN>); nunca se publica 51821.
      PORT: "51821"
      HOST: "0.0.0.0"
      INSECURE: "false"
      DISABLE_IPV6: "true"
      # wg-easy v15 se configura en el asistente web del primer arranque
      # (nombre de host = WG_HOST del .env, puerto 51820). Alternativa sin asistente:
      # INIT_ENABLED=true + INIT_USERNAME/INIT_PASSWORD/INIT_HOST/INIT_PORT.
    ports:
      - "0.0.0.0:51820:51820/udp"   # solo IPv4, mismo motivo que en caddy
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - wg_easy_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    networks:
      - gd_front
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:51821/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
