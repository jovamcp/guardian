# Alertas de Guardian (provisionadas; Grafana expande $VARIABLES del entorno del contenedor).
# Fuente: https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
# Destino: ntfy por webhook con la plantilla nativa de Grafana
#   https://docs.ntfy.sh/publish/#message-templating  (…/<topic>?template=grafana)
apiVersion: 1

contactPoints:
  - orgId: 1
    name: ntfy
    receivers:
      - uid: guardian-ntfy
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${NTFY_URL}/${NTFY_TOPIC}?template=grafana
          httpMethod: POST

policies:
  - orgId: 1
    receiver: ntfy
    group_by: ["alertname", "agent"]
    group_wait: 30s
    group_interval: 2m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: guardian
    folder: Guardian
    interval: 1m
    rules:
      - uid: guardian-egress-denied
        title: "Egreso denegado a un agente"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: squid
        annotations:
          summary: "Un agente intentó salir a un destino fuera de su allowlist"
          description: "Conexiones denegadas por Squid o DNS bloqueado por Blocky en los últimos 5 minutos. Revisa el panel Guardian · Egreso."
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: guardian-loki
            model:
              refId: A
              expr: 'sum(count_over_time({service=~"squid|blocky", event=~"egress_denied|dns_blocked"}[5m])) or vector(0)'
              queryType: instant
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: guardian-auth-failures
        title: "Fallos de autenticación repetidos"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
          source: pocket-id
        annotations:
          summary: "5 o más errores de autenticación en Pocket ID en 10 minutos"
          description: "Revisa el panel Guardian · Accesos (IP de origen y código de error)."
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: guardian-loki
            model:
              refId: A
              expr: 'sum(count_over_time({service="pocket-id", event="auth_error"} | json | error_code!="not_signed_in" [10m])) or vector(0)'
              queryType: instant
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [4]}
      - uid: guardian-firewall-forward
        title: "Tráfico descartado hacia servicios publicados"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: info
          source: nftables
        annotations:
          summary: "Alguien fuera de LAN/AI/WG intentó llegar a 443 (DOCKER-USER)"
          description: "Descartes gd-drop-fwd en los últimos 15 minutos. Ver Guardian · Accesos."
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: guardian-loki
            model:
              refId: A
              expr: 'sum(count_over_time({service="nftables", event="fw_drop_forward"}[15m])) or vector(0)'
              queryType: instant
              instant: true
              range: false
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
