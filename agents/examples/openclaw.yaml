# OpenClaw dentro del sandbox de Guardian: un turno del agente sin gateway propio
# (`openclaw agent --local`) contra el modelo local a través de gd-gateway con llave efímera.
#   sudo make render-egress && sudo guardianctl agent run openclaw
#   OPENCLAW_TASK="..." cambia la tarea. Guía: docs/agentes.md.
name: openclaw

# ghcr.io/openclaw/openclaw:latest = 2026.9.4 (índice multi-arch amd64/arm64, 2026-09-10).
# Fijado por digest: aunque `latest` avance, este manifiesto no cambia (regla dura 4).
image: ghcr.io/openclaw/openclaw@sha256:cc596b846506a5f4cfcee111394a2725f375f01cca2ebb492a161fd1b747f101

llm:
  models: [qwen2.5:0.5b]
  key: auto

egress:
  # Sin salida a Internet: OpenClaw solo habla con gd-gateway. Cualquier otro destino queda
  # denegado y registrado (auto-actualización y descargas ya van desactivadas por env).
  allow: []

resources:
  cpus: "2"
  memory: 2g
  pids: 256

# Estado y configuración en /home/agent (tmpfs del sandbox); OpenClaw los busca vía OPENCLAW_*.
tmpfs:
  - /home/agent/.openclaw:256m

env:
  OPENCLAW_TASK: "Responde en una frase y en español: ¿qué es una VLAN?"
  OPENCLAW_HOME: /home/agent
  OPENCLAW_STATE_DIR: /home/agent/.openclaw
  OPENCLAW_CONFIG_PATH: /home/agent/.openclaw/openclaw.json
  OPENCLAW_NO_AUTO_UPDATE: "1"
  OPENCLAW_OFFLINE: "1"

mounts:
  - ./openclaw:/opt/guardian-agent          # openclaw.json (plantilla) y run.sh, solo lectura

# La imagen arranca con tini; el comando sustituye al gateway por un turno local.
command: ["sh", "/opt/guardian-agent/run.sh"]

schedule:
  cron: ""
